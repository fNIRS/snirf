[project]
name = "snirfblueprint"
version = "1.2.0"
description = "SNIRF Blueprint Validator"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "h5py==3.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
snirfblueprint = "snirfblueprint:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
