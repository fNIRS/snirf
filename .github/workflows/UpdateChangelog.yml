name: Check CHANGELOG Update

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  check-changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: CHANGELOG.md

      - name: Check for bypass label
        id: bypass
        run: |
          if echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q '"skip changelog"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require CHANGELOG update
        if: |
          steps.changed-files.outputs.any_changed != 'true' &&
          steps.bypass.outputs.skip != 'true'
        run: |
          echo "::error::Please update CHANGELOG.md or add the 'skip changelog' label to this pull request."
          exit 1
